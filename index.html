<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Message</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    overflow:hidden;
}

.background{
    position:absolute;
    width:100%;
    height:100%;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
    width:250px;
    height:250px;
    top:10%;
    left:10%;
}

.circle:nth-child(2){
    width:180px;
    height:180px;
    bottom:10%;
    right:10%;
}

.circle:nth-child(3){
    width:120px;
    height:120px;
    top:60%;
    left:20%;
}

@keyframes float{
    50%{
        transform:translateY(-25px);
    }
}

.card{
    position:relative;
    z-index:2;
    width:90%;
    max-width:450px;
    padding:40px;
    text-align:center;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    color:white;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.icon{
    font-size:70px;
    margin-bottom:20px;
}

h1{
    font-size:30px;
    margin-bottom:10px;
}

p{
    opacity:0.9;
    margin-bottom:30px;
}

.play-btn{
    width:90px;
    height:90px;
    border:none;
    border-radius:50%;
    background:white;
    color:#764ba2;
    font-size:35px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.play-btn:hover{
    transform:scale(1.1);
}

.audio-player{
    margin-top:25px;
    width:100%;
}

.status{
    margin-top:20px;
    font-weight:600;
}
</style>
</head>

<body>

<div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="card">
    <div class="icon">🎙️</div>

    <h1>Voice Message</h1>

    <p>
        Click the button below to listen to the voice note.
    </p>

    <button class="play-btn" onclick="playVoice()">
        ▶
    </button>

    <div class="status" id="status">
        Ready to play
    </div>

    <audio id="voiceNote" class="audio-player" controls>
        <source src="voice-note.mp4" type="audio/mp4">
        Your browser does not support audio playback.
    </audio>
</div>

<script>
function playVoice() {
    const audio = document.getElementById('voiceNote');
    const status = document.getElementById('status');

    audio.play();
    status.innerHTML = "🎧 Playing voice note...";
}

document.getElementById('voiceNote').addEventListener('ended', function() {
    document.getElementById('status').innerHTML =
        "✅ Voice note completed";
});
</script>

</body>
</html>
